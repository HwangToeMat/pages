<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울 법정동 균등 랜덤 뽑기</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --highlight: #f59e0b;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 40px 24px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--subtext);
      font-size: 0.9rem;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .display-box {
      background-color: #0f172a;
      border: 2px dashed #334155;
      border-radius: 16px;
      padding: 30px 20px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      transition: all 0.25s ease;
    }

    .display-box.rolling-gu {
      border-color: var(--highlight);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
    }

    .display-box.rolling-dong {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 9999px;
      background: #334155;
      color: var(--subtext);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .gu-name {
      font-size: 1.3rem;
      color: var(--text);
      font-weight: 700;
      margin-bottom: 4px;
      min-height: 32px;
    }

    .gu-name.active {
      color: var(--highlight);
    }

    .dong-name {
      font-size: 2.2rem;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: -0.5px;
      min-height: 52px;
    }

    button.pick-btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 16px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.pick-btn:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    button.pick-btn:active {
      transform: scale(0.98);
    }

    button.pick-btn:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .links {
      display: none;
      gap: 10px;
      margin-top: 20px;
    }

    .links.show {
      display: flex;
    }

    .map-btn {
      flex: 1;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      background-color: #334155;
      color: var(--text);
      transition: background-color 0.2s;
    }

    .map-btn:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎲 서울 법정동 균등 추첨</h1>
    <p class="subtitle">25개 자치구 균등 추첨(4%) 후<br>해당 구 내부 법정동 랜덤 선택</p>

    <div class="display-box" id="displayBox">
      <span class="status-badge" id="statusBadge">대기 중</span>
      <div class="gu-name" id="guDisplay">-</div>
      <div class="dong-name" id="dongDisplay">버튼을 눌러주세요</div>
    </div>

    <button class="pick-btn" id="pickBtn" onclick="startDraw()">랜덤 뽑기</button>

    <div class="links" id="mapLinks">
      <a class="map-btn" id="naverMap" href="#" target="_blank" rel="noopener">네이버 지도 검색</a>
      <a class="map-btn" id="kakaoMap" href="#" target="_blank" rel="noopener">카카오맵 검색</a>
    </div>
  </div>

      "강북구": ["미아동","번동","수유동","우이동"],
      "도봉구": ["쌍문동","방학동","창동","도봉동"],
      "노원구": ["월계동","공릉동","하계동","상계동","중계동"],
      "은평구": ["수색동","녹번동","불광동","갈현동","구산동","대조동","응암동","역촌동","신사동","증산동","진관동"],

      "송파구": ["잠실동","신천동","풍납동","송파동","석촌동","삼전동","가락동","문정동","장지동","방이동","오금동","거여동","마천동"],

    const guList = Object.keys(seoulDongMap);

    function startDraw() {
      const btn = document.getElementById("pickBtn");
      const guDisplay = document.getElementById("guDisplay");
      const dongDisplay = document.getElementById("dongDisplay");
      const displayBox = document.getElementById("displayBox");
      const statusBadge = document.getElementById("statusBadge");
      const mapLinks = document.getElementById("mapLinks");

      btn.disabled = true;
      mapLinks.classList.remove("show");

      // 1단계: 25개 자치구 롤링 (균등 확률 1/25)
      statusBadge.innerText = "1단계: 자치구 추첨 중 (1/25)";
      displayBox.className = "display-box rolling-gu";
      guDisplay.classList.add("active");
      dongDisplay.innerText = "???";

      let guTick = 0;
      const guInterval = setInterval(() => {
        const tempGu = guList[Math.floor(Math.random() * guList.length)];
        guDisplay.innerText = tempGu;
        guTick++;

        if (guTick >= 15) {
          clearInterval(guInterval);
          const chosenGu = guList[Math.floor(Math.random() * guList.length)];
          guDisplay.innerText = chosenGu;
          guDisplay.classList.remove("active");

          // 2단계: 선정된 구 내부의 법정동 롤링
          rollDong(chosenGu);
        }
      }, 50);
    }

    function rollDong(selectedGu) {
      const btn = document.getElementById("pickBtn");
      const guDisplay = document.getElementById("guDisplay");
      const dongDisplay = document.getElementById("dongDisplay");
      const displayBox = document.getElementById("displayBox");
      const statusBadge = document.getElementById("statusBadge");
      const mapLinks = document.getElementById("mapLinks");

      const dongCandidates = seoulDongMap[selectedGu];
      statusBadge.innerText = `2단계: ${selectedGu} 내 동 추첨 중 (1/${dongCandidates.length})`;
      displayBox.className = "display-box rolling-dong";

      let dongTick = 0;
      const dongInterval = setInterval(() => {
        const tempDong = dongCandidates[Math.floor(Math.random() * dongCandidates.length)];
        dongDisplay.innerText = tempDong;
        dongTick++;

        if (dongTick >= 20) {
          clearInterval(dongInterval);
          const chosenDong = dongCandidates[Math.floor(Math.random() * dongCandidates.length)];
          dongDisplay.innerText = chosenDong;

          statusBadge.innerText = "추첨 완료 🎉";
          displayBox.className = "display-box";

          // 지도 링크 바인딩
          const fullQuery = encodeURIComponent(`서울 ${selectedGu} ${chosenDong}`);
          document.getElementById("naverMap").href = `https://map.naver.com/p/search/${fullQuery}`;
          document.getElementById("kakaoMap").href = `https://map.kakao.com/?q=${fullQuery}`;

          mapLinks.classList.add("show");
          btn.disabled = false;
        }
      }, 50);
    }
  </script>
</body>
</html>
