<html lang="ko">
<head>

  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --accent: #38bdf8;
      --dart: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background-color: var(--card);
      border: 1px solid #22304e;
      border-radius: 24px;
      padding: 24px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    p.desc {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-top: 4px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* 지도 영역 */
    .map-wrapper {
      position: relative;
      width: 100%;
      height: 330px;
      background: #090d16;
      border-radius: 16px;
      border: 1px solid #1e293b;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg.seoul-map {
      width: 95%;
      height: 95%;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.1));
    }

    .gu-path {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1.5;
      transition: fill 0.3s;
    }

    .gu-path.hit {
      fill: #1e3a5f;
      stroke: var(--accent);
    }

    .gu-label {
      fill: #64748b;
      font-size: 9px;
      font-weight: 600;
      pointer-events: none;
      text-anchor: middle;
    }

    .river-path {
      stroke: #0284c7;
      stroke-width: 6;
      fill: none;
      opacity: 0.5;
      stroke-linecap: round;
    }

    /* 다트 핀 */
    .dart-pin {
      position: absolute;
      width: 28px;
      height: 28px;
      margin-left: -14px;
      margin-top: -28px;
      display: none;
      z-index: 10;
      pointer-events: none;
    }

    .dart-pin.dropping {
      display: block;
      animation: dropDart 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes dropDart {
      0% {
        transform: translateY(-200px) scale(2.8) rotate(-20deg);
        opacity: 0;
      }
      70% {
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .ripple {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--dart);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
    }

    .ripple.animate {
      animation: rippleEffect 0.8s ease-out;
    }

    @keyframes rippleEffect {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
    }

    /* 결과 카드 */
    .result-card {
      margin-top: 16px;
      background: #0d1322;
      border: 1px solid #1f2a44;
      border-radius: 14px;
      padding: 16px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .result-gu {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--subtext);
    }

    .result-dong {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
      margin: 2px 0;
    }

    /* 버튼 & 링크 */
    button.throw-btn {
      margin-top: 14px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.4);
      transition: all 0.2s;
    }

    button.throw-btn:hover {
      background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
      transform: translateY(-1px);
    }

    button.throw-btn:active {
      transform: scale(0.98);
    }

    button.throw-btn:disabled {
      background: #334155;
      box-shadow: none;
      cursor: not-allowed;
    }

    .map-buttons {
      display: none;
      gap: 8px;
      margin-top: 12px;
    }

    .map-buttons.show {
      display: flex;
    }

    .map-link {
      flex: 1;
      padding: 10px;
      background: #1e293b;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
      transition: 0.2s;
    }

    .map-link:hover {
      background: #334155;
    }
  </style>
</head>

    // 가중치 기반 무작위 추첨 함수 (467개 전수 대상)
    function getWeightedRandomDong() {
      const totalWeight = allDongs.reduce((acc, cur) => acc + cur[2], 0);
      let rand = Math.random() * totalWeight;
      for (let i = 0; i < allDongs.length; i++) {
        if (rand < allDongs[i][2]) {
          return allDongs[i];
        }
        rand -= allDongs[i][2];
      }
      return allDongs[allDongs.length - 1];
    }

    function throwDart() {
      const btn = document.getElementById("throwBtn");
      const dartPin = document.getElementById("dartPin");
      const ripple = document.getElementById("ripple");
      const resultGu = document.getElementById("resultGu");
      const resultDong = document.getElementById("resultDong");
      const mapButtons = document.getElementById("mapButtons");
      const mapWrapper = document.getElementById("mapWrapper");

      btn.disabled = true;
      mapButtons.classList.remove("show");
      document.querySelectorAll(".gu-path").forEach(p => p.classList.remove("hit"));

      // 467개 전수 중 가중치 추첨
      const chosen = getWeightedRandomDong();
      const chosenGu = chosen[0];
      const chosenDong = chosen[1];
      const coords = guCoords[chosenGu] || { x: 250, y: 200 };

      resultGu.innerText = "조준 중...";
      resultDong.innerText = "🎯 슝~";

      // 구 중심 기준 자연스러운 오차 산포
      const offsetX = (Math.random() - 0.5) * 18;
      const offsetY = (Math.random() - 0.5) * 18;

      const rect = mapWrapper.getBoundingClientRect();
      const targetPxX = ((coords.x + offsetX) / 500) * rect.width;
      const targetPxY = ((coords.y + offsetY) / 400) * rect.height;

      dartPin.style.left = `${targetPxX}px`;
      dartPin.style.top = `${targetPxY}px`;
      dartPin.className = "dart-pin dropping";

      setTimeout(() => {
        const guElement = document.getElementById(`gu-${chosenGu}`);
        if (guElement) guElement.classList.add("hit");

        ripple.style.left = `${targetPxX}px`;
        ripple.style.top = `${targetPxY}px`;
        ripple.className = "ripple animate";

        resultGu.innerText = `서울특별시 ${chosenGu}`;
        resultDong.innerText = chosenDong;

        const query = encodeURIComponent(`서울 ${chosenGu} ${chosenDong}`);
        document.getElementById("naverLink").href = `https://map.naver.com/p/search/${query}`;
        document.getElementById("kakaoLink").href = `https://map.kakao.com/?q=${query}`;
        mapButtons.classList.add("show");

        btn.disabled = false;
      }, 450);
    }
